name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: read

env:
  OPAMROOTISOK: "1"
  EXILE_TOOLCHAIN: /opt/amiga-gcc

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/exile-lang-ci:latest
      options: --user 0:0

    steps:
    - uses: actions/checkout@v4

    - name: Sync OCaml deps (incremental over baked switch)
      run: opam install . --deps-only --with-test --yes

    - name: Build compiler
      run: opam exec -- make build

    - name: Run tests
      run: opam exec -- make test

    - name: Build examples (compile to C + cc -ansi -pedantic -Wall)
      run: opam exec -- make examples

    - name: Verify host stdout snapshots
      run: opam exec -- make verify-host

    # ===== Self-host bring-up — differential-harness gate =====
    #
    # `make selfhost-diff` checks that the OCaml exilc still emits the
    # committed corpus byte-for-byte across every example × 3 dump
    # forms (tokens / AST / typed IR).  Any drift here is either an
    # intentional format change (the PR should also include the regen
    # under tests/golden/) or a regression in the OCaml emitter.
    #
    # Drift detection is symmetric — a PR that changes the emitter but
    # forgets to refresh tests/golden/ produces the exact same
    # "drift X" failure here, so a separate regen + git-diff gate
    # would be redundant.
    - name: Verify selfhost dumps byte-stable (against the oracle)
      run: opam exec -- make selfhost-diff

    # ===== The self-host proof, as a gate =====
    #
    # Everything above checks the ORACLE.  `selfhost-verify` checks the PORT: the
    # bootstrap fixpoint (the port compiled by the port emits byte-identical C for
    # its own source) plus every differential layer — tokens, lexer errors, AST,
    # parser errors, typed IR, post-drop IR, and the escape pass's diagnostics.
    #
    # Until now the fixpoint was reproduced by hand in sessions.  That is exactly
    # the kind of proof that silently rots: the first regression to slip in would
    # not have failed anything.
    - name: Verify the self-host proof (fixpoint + every port gate)
      run: opam exec -- make selfhost-verify

  # ===== The seed bootstrap, on a runner with no OCaml =====
  #
  # Every other job builds exilc through opam + dune.  This one proves the claim
  # the seed exists to make: a fresh clone builds a working exilc with nothing
  # but a C compiler.  It deliberately runs on the PLAIN runner — no
  # exile-lang-ci container, no opam switch — so the proof cannot quietly lean on
  # a toolchain that happens to be lying around.
  #
  # The absence check is not ceremony: if a future runner image ever ships OCaml,
  # this job would still pass while proving strictly less than it claims.  Better
  # to fail loudly and rethink the proof than to keep a badge that has stopped
  # meaning anything.
  seed-bootstrap:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Assert no OCaml toolchain is present
      run: |
        for t in opam dune ocaml ocamlfind; do
          if command -v "$t" >/dev/null 2>&1; then
            echo "::error::$t is on PATH — this job no longer proves an OCaml-free build"
            exit 1
          fi
        done
        echo "no opam / dune / ocaml / ocamlfind on PATH; cc = $(cc --version | head -1)"

    - name: Bootstrap exilc from the committed seed (cc only)
      run: make bootstrap-from-seed

    # The five gates that never compare against the reference — they build from
    # the seed, so this runner can run them.  They live here rather than in
    # `selfhost-verify`'s job so the OCaml-free claim is PROVEN on the runner
    # that asserts the absence, instead of resting on a comment in the Makefile.
    - name: Run the gates that need no OCaml
      run: make selfhost-seed-gates

  amiga-verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/exile-lang-ci:latest
      options: --user 0:0

    steps:
    - uses: actions/checkout@v4

    - name: Sync OCaml deps (incremental over baked switch)
      run: opam install . --deps-only --with-test --yes

    - name: Build compiler
      run: opam exec -- make build

    - name: Cross-compile examples + verify under vamos
      run: opam exec -- make verify-amiga

    # The chipset machine. Every other job here asserts EMISSION; this one runs
    # freestanding binaries as 68000 code against a modelled custom chip and
    # checks what they PRINT. Its negative controls run first, so a machine that
    # had gone gentle - mapping all of memory, or shrugging at an opcode - fails
    # the gate before any witness is believed.
    - name: Execute bare-metal witnesses on the chipset machine (verify-emu)
      run: opam exec -- make verify-emu

    # The port's --target amiga vs the oracle's, on the same toolchain + vamos.
    # Proves the self-hosted driver cross-compiles to a byte-identical, correctly
    # running m68k binary. Lives here (not in selfhost-verify) because it needs
    # the cross toolchain the toolchain-free port suite deliberately avoids.
    #
    - name: Port amiga driver parity (selfhost-amiga)
      run: opam exec -- make selfhost-amiga
