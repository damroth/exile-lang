name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/exile-lang-ci:latest
      options: --user 0:0
    env:
      OPAMROOTISOK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Build compiler
        run: opam exec -- make build

      - name: Run tests
        run: opam exec -- make test

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          header="## [$version]"
          awk -v h="$header" '
            index($0, h) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[.*\]: / { next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for version $version" >&2
            exit 1
          fi
          cat release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' < release_notes.md)
          payload=$(printf '{"tag_name":"%s","name":"%s","body":%s}' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$body")
          curl -fSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
