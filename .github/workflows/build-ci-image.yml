name: Build CI image

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "Dockerfile.ci"
      - ".gitmodules"
      - "tools/amiga-gcc"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Resolve amiga-gcc submodule SHA
      id: submod
      run: |
        sha=$(git ls-tree HEAD tools/amiga-gcc | awk '{print $3}')
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.ci
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/exile-lang-ci:latest
          ghcr.io/${{ github.repository_owner }}/exile-lang-ci:${{ steps.submod.outputs.sha }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/exile-lang-ci:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/exile-lang-ci:buildcache,mode=max
